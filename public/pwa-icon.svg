<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Sofa / Furniture Icon -->
  <g transform="translate(96, 110)" filter="url(#shadow)" fill="white">
    <!-- Sofa Backrest -->
    <path d="M40,110 C40,55 85,20 160,20 C235,20 280,55 280,110 L280,150 L40,150 Z" />
    <!-- Armrest Left -->
    <rect x="10" y="90" width="50" height="90" rx="25" />
    <!-- Armrest Right -->
    <rect x="260" y="90" width="50" height="90" rx="25" />
    <!-- Seat Cushion -->
    <rect x="40" y="140" width="240" height="50" rx="16" />
    <!-- Legs -->
    <polygon points="50,190 40,230 58,230 65,190" fill="#fca5a5" />
    <polygon points="270,190 262,230 280,230 270,190" fill="#fca5a5" />
  </g>

  <!-- Typography: ASHLEY OUTLET -->
  <text x="256" y="380" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="4">
    ASHLEY
  </text>
  
  <!-- OUTLET Badge -->
  <rect x="180" y="405" width="152" height="34" rx="8" fill="#ffffff" />
  <text x="256" y="429" text-anchor="middle" fill="#dc2626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="3">
    OUTLET
  </text>
</svg>
